# Die Addons, die als Release-Tag auf den Server gehen — "repo tag" je Zeile.
# Ein Addon ohne Tag hier laeuft in der Fassung des Playground-vendor.
# Vor jedem Bump pruefen: ist das Tag gepusht (Packagist kennt es), und
# gehoert die Arbeit im Repo einem abgeschlossenen Release?
#
