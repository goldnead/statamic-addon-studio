# Die Addons, die als Release-Tag auf den Server gehen — "repo tag" je Zeile.
# Ein Addon ohne Tag hier laeuft in der Fassung des Playground-vendor.
# Vor jedem Bump pruefen: ist das Tag gepusht (Packagist kennt es), und
# gehoert die Arbeit im Repo einem abgeschlossenen Release?
#
# Stand 03.09.2026: alle 26 Addons stehen hier. Vorher waren es 18 — die acht
# fehlenden liefen in der Playground-vendor-Fassung, was am 03.09. zu zwei
# 500ern auf der Demo fuehrte (assessments und clientrooms waren ausgeliefert,
# ihre Migrationen aber nie gelaufen). Alle Tags an diesem Tag gegen "git
# ls-remote --tags origin" geprueft: jedes ist gepusht.
#
# ACHTUNG, Stand 07.09.2026: die Liste unten steht auf den Zielfassungen des
# Phase-2-Releases (TASKS/suite-release-plan-2026-09-07.md, Abschnitt 2 und 5).
# **Diese Tags gibt es noch nicht.** Adrian vergibt sie selbst, in der
# Reihenfolge der Wellen; brand-context v1.13.0 zuerst, weil 20 Repos ein
# "^1.13" verlangen. Wer vor dem Taggen build.sh startet, bricht sich den Bau:
# `git archive <tag>` findet das Objekt nicht, und `set -euo pipefail` beendet
# das Skript mitten in der Schleife — /tmp/statamic-demo-build ist dann halb
# gefuellt, die Waechter aus 3a und der installed.json-Schritt aus 4 laufen gar
# nicht mehr. Nie den Ordner rsyncen, ohne vorher den Exit-Code von build.sh
# gesehen zu haben.
#
# Stand 08.09.2026: zehn Zeilen angehoben auf die Fassungen mit der
# CP-Setup-Wache (Leerzustand statt HTTP 500, wenn die Tabellen fehlen) —
# activity, assessments, booking, clientrooms, entitlements, events, funnels,
# offers, products, webhook-manager. Jeder dieser Tags sitzt auf genau dem
# Commit, den die CI gruen gemeldet hat, und ist auf Packagist sichtbar.
# Noch nicht hier: leadhub, marketing, automations (CI lief noch) und
# lead-magnets (CI war aus einem aelteren Grund rot).
#
# Diese Datei laeuft nicht mit, sie wird von Hand gepflegt. Am 07.09. lagen
# elf Zeilen hinter den vorhandenen Tags zurueck, bevor ueberhaupt jemand an
# das Release dachte: assessments, automations, booking, clientrooms,
# flow-canvas, insights, invoices, leadhub, offers, payments, products.
# Vor jedem Bump gegen "git -C ~/projects/<repo> describe --tags" gegenpruefen.

