title: E-Mail-Vorlage
tabs:
  main:
    display: Inhalt
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
              display: Titel
              localizable: true
          -
            handle: subject
            field:
              type: text
              display: Betreff
              instructions: 'Die Betreffzeile der E-Mail. Unterstützt Merge-Variablen wie {{ contact.first_name }}.'
              localizable: true
          -
            handle: preview
            field:
              type: text
              display: Vorschautext
              instructions: 'Preheader: kurzer Vorschautext, den Mail-Clients neben dem Betreff anzeigen. Unterstützt Merge-Variablen wie {{ contact.first_name }}.'
              localizable: true
          -
            handle: layout
            field:
              type: select
              display: Layout
              instructions: 'Welches Layout diese E-Mail umschließt. Leer = Standard-Layout.'
              options:
                transactional: Transactional
                kampagne: Kampagne
              clearable: true
              placeholder: Standard-Layout
              localizable: false
          -
            handle: body
            field:
              type: bard
              display: Inhalt
              instructions: 'Der E-Mail-Inhalt, als Rich-Text verfasst. Wird für Versand und Vorschau zu HTML gerendert.'
              buttons:
                - h2
                - h3
                - bold
                - italic
                - underline
                - unorderedlist
                - orderedlist
                - quote
                - anchor
                - image
                - table
                - horizontalrule
                - removeformat
              save_html: false
              localizable: true
          -
            handle: plain_text
            field:
              type: textarea
              display: Nur-Text
              instructions: 'Optionale Nur-Text-Variante für Clients, die kein HTML darstellen.'
              localizable: true
          -
            handle: brand
            field:
              type: select
              display: Marke
              instructions: 'Zu welcher Marke diese Vorlage gehört. Gefunden wird sie nur von ihrer eigenen Marke, deshalb können zwei Marken je eine eigene Vorlage unter demselben Slug haben.'
              options:
                chorwerkstatt: 'Chorwerkstatt Nord'
                halbmond: 'Kollektiv Halbmond'
                sonderzeichen: 'Müller & Söhne <Chor> „Ännchen"'
                nordlicht: 'Nordlicht Studio'
                lindhorst: 'Praxis Lindhorst'
              required: true
              validate:
                - required
              clearable: false
              localizable: false
          -
            handle: description
            field:
              type: textarea
              display: Beschreibung
              instructions: 'Interne Notiz. Wird nicht an Empfänger gesendet.'
