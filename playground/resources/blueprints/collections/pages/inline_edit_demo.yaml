title: 'Inline Edit Demo'

# Eine eigene Vorlage statt zwei Felder im geteilten `pages`-Blueprint. Die
# Demo braucht genau die Fälle, die das Addon unterscheidet, und die gehen
# niemanden etwas an, der eine Markenseite pflegt.

tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              display: Titel
          -
            handle: kicker
            field:
              type: text
              display: Dachzeile
              instructions: 'Absichtlich leer gelassen, damit der leere Zustand im Frontend zu sehen ist.'
          -
            handle: intro
            field:
              type: textarea
              display: Einleitung
              instructions: 'Mehrzeilig. Enter setzt im Frontend einen Umbruch, statt das Feld zu verlassen.'
          -
            handle: note
            field:
              type: textarea
              display: Notiz
              instructions: 'Auch mehrzeilig, aber ohne echten Zeilenumbruch im Wert. Rendert deshalb im Frontend exakt so wie fuer einen Besucher.'
          -
            handle: seats
            field:
              type: integer
              display: Plätze
          -
            handle: body
            field:
              type: markdown
              display: Text
              instructions: 'Doppelklick oeffnet die Markdown-Quelle, nicht das gerenderte HTML.'
          -
            handle: belegung
            field:
              type: select
              display: Belegung
              options:
                offen: 'Plaetze frei'
                warteliste: Warteliste
                voll: Ausgebucht
          -
            handle: starts_on
            field:
              type: date
              display: Beginn
          -
            handle: schlagworte
            field:
              type: list
              display: Schlagworte
              instructions: 'Kein Fieldtype, den die Seite bedienen kann. Doppelklick oeffnet das Control Panel.'
          -
            handle: promoted
            field:
              type: toggle
              display: Hervorgehoben
              instructions: 'Der Wert steht nicht auf der Seite, das Template macht ein Wort daraus. Doppelklick oeffnet deshalb einen Schalter.'
  meta:
    display: Meta
    sections:
      -
        fields:
          -
            import: seo
