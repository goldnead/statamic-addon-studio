title: Kursanfrage
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: name
            field: { type: text, display: Name, validate: [required] }
          -
            handle: email
            field: { type: text, input_type: email, display: 'E-Mail', validate: [required, email] }
          -
            handle: stimmlage
            field:
              type: select
              display: Stimmlage
              options: { sopran: Sopran, alt: Alt, tenor: Tenor, bass: Bass, weiss_nicht: 'Weiß ich nicht' }
          -
            handle: nachricht
            field: { type: textarea, display: Nachricht }
          -
            handle: utm_source
            field: { type: hidden, display: utm_source }
          -
            handle: utm_medium
            field: { type: hidden, display: utm_medium }
          -
            handle: utm_campaign
            field: { type: hidden, display: utm_campaign }
