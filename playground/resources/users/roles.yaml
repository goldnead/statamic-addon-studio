# Eine Agentur mit Kunden hat nicht einen Superuser, sie hat ein Team mit
# unterschiedlichem Zugriff. Genau das ist der Fall, in dem sich Markenscoping
# und Berechtigungen entscheiden — mit einem einzigen Superuser sieht jede
# Berechtigung gleich aus, nämlich erlaubt.
agentur:
  title: Agentur
  permissions:
    - 'access cp'
    - 'view brands'
    - 'manage brands'
    - 'configure collections'
    - 'configure forms'
    - 'view forms'
    - 'access payments utility'
    - 'access subscriptions utility'
    - 'access offers utility'
    - 'access coupons utility'
    - 'access funnels utility'
    - 'access bookings utility'
    - 'view automations'
    - 'create automations'
    - 'edit automations'
    - 'enable automations'
    - 'view automation runs'
    - 'view webhooks'
    - 'manage outbound webhooks'
    - 'view activity'
    - 'view entitlements'
    - 'grant entitlements'
    - 'revoke entitlements'
    - 'view leadhub'
    - 'manage leadhub contacts'
    # statamic-inbox: lesen und antworten, NICHT 'manage inbox mailboxes'.
    # Ein Postfach-Formular auf einer oeffentlichen Demo waere ein IMAP-Pruefer.
    - 'view inbox'
    - 'reply inbox'

redaktion:
  title: Redaktion
  permissions:
    - 'access cp'
    - 'view forms'
    - 'view leadhub'
    - 'manage leadhub contacts'
    - 'view activity'

# Chorfinder-Demo (directory, messaging, community, teams-Claims): die
# Moderation eines Chorverzeichnisses. Sie sieht die drei Bereiche im CP und
# darf Ansprueche auf Profile entscheiden (App\Claims\DemoClaimPolicy), sonst
# nichts: kein Zahlungsverkehr, keine Marken, keine Einstellungen.
chorfinder_moderation:
  title: 'Chorfinder-Moderation'
  permissions:
    - 'access cp'
    - 'view directory'
    - 'manage directory'
    - 'view community'
    - 'moderate community'
    - 'view messaging'
    - 'manage messaging'

buchhaltung:
  title: Buchhaltung
  permissions:
    - 'access cp'
    - 'access payments utility'
    - 'access subscriptions utility'
    - 'view entitlements'
