title: 'Meta / SEO'
fields:
  -
    handle: meta_title
    field:
      type: text
      display: 'Titel für Suchmaschinen'
      instructions: 'Leer lassen, dann wird der Seitentitel genommen.'
  -
    handle: meta_description
    field:
      type: textarea
      display: Beschreibung
      character_limit: 200
  -
    handle: noindex
    field:
      type: toggle
      display: 'Nicht indexieren'
      default: false
